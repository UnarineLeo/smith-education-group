<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title>Admin Log In</ion-title>
    <ion-button slot="end" fill="clear" routerLink="/tabs/home">Back</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <div class="auth-shell login-shell">
    <div class="auth-hero">
      <p class="auth-kicker">Admin Access</p>
        <h2>Manage Unipply</h2>
        <p class="auth-subtitle">Access the Unipply admin portal to manage universities, applications, and deadlines.</p>
      <div class="auth-pills">
        <span>Registration</span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="auth-card">
      <div class="card-topline"></div>

      <ion-item lines="none" class="field-item">
        <ion-label position="stacked">Email Address</ion-label>
        <ion-input type="email" [(ngModel)]="email" placeholder="admin@domain.com"></ion-input>
      </ion-item>

      <ion-item lines="none" class="field-item">
        <ion-label position="stacked">Password</ion-label>
        <ion-input type="password" [(ngModel)]="password" placeholder="Enter your password"></ion-input>
      </ion-item>

      <div class="row-end">
        <ion-button fill="clear" size="small" class="link-btn" (click)="forgotPassword()">
          Forgot password?
        </ion-button>
      </div>

      <ion-button expand="block" class="primary-btn" (click)="login()">
        Log In
      </ion-button>

      <ion-button expand="block" fill="outline" class="google-btn" (click)="continueWithGoogle()">
        Continue with Google
      </ion-button>

      <ion-text class="auth-footer">
        New to Unipply?
        <button type="button" class="inline-link" (click)="openRegister()">Create an account</button>
      </ion-text>
    </div>
  </div>

  <app-footer></app-footer>
</ion-content>
